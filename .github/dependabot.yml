# Mises à jour groupées, une PR par écosystème et par mois : peu de bruit, rien d'oublié.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    # @astrojs/check n'accepte pas encore TypeScript 7 (peer ^5 || ^6).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
