name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sh scripts/install-tectonic.sh
      - run: npm run check
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/dist
            --remap 'https://ramazankus\.dev/(.*) file://${{ github.workspace }}/dist/$1'
            'dist/**/*.html' 'dist/sitemap-*.xml'
          fail: true
